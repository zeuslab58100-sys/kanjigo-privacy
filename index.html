<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>KanjiGo · Privacy Policy</title><style>body{font-family:system-ui,-apple-system,Arial,sans-serif;margin:0;background:#f8fafc;color:#152133;line-height:1.65}main{max-width:780px;margin:40px auto;padding:28px;background:white;border-radius:14px;box-shadow:0 2px 18px #10182812}h1{font-size:1.85rem}h2{font-size:1.08rem;margin-top:25px}select{padding:9px;border:1px solid #aaa;border-radius:7px}a{color:#17499c}@media(max-width:700px){main{margin:0;padding:22px;border-radius:0}}</style></head><body><main><p><strong>KanjiGo</strong> · <label for="lang">Language / Lingua:</label> <select id="lang" onchange="render()"><option value="it">Italiano</option><option value="en">English</option><option value="fr">Français</option><option value="es">Español</option><option value="de">Deutsch</option></select></p><div id="body"></div></main><script>const texts={"it": {"title": "Informativa sulla privacy", "updated": "Ultimo aggiornamento: 10 novembre 2026", "blocks": [["Titolare e contatti", "Il titolare del trattamento è Alessandro Boggi. Per domande sulla privacy o per esercitare i tuoi diritti: zeuslab58100@gmail.com."], ["Come funziona KanjiGo", "KanjiGo è un’app per lo studio dei kanji e del vocabolario giapponese, utilizzabile offline. Non richiede la creazione di un account."], ["Dati salvati sul dispositivo", "L’app salva sul dispositivo preferenze (ad esempio la lingua scelta), progressi di apprendimento, risultati e impostazioni mediante SharedPreferences e un database SQLite. Questi dati servono per il funzionamento richiesto dall’utente e non vengono inviati ai server del titolare, secondo la verifica delle funzionalità effettuata per questa versione."], ["Acquisto tramite gli store", "L’acquisto dell’app è gestito da Google Play o Apple App Store, secondo i rispettivi termini e informative privacy. Il titolare non riceve direttamente i dati completi delle carte di pagamento tramite KanjiGo."], ["Comunicazioni e destinatari", "La versione verificata non integra account, pubblicità, sistemi di analisi del comportamento o servizi cloud proprietari. Se ci contatti via email, utilizzeremo il tuo indirizzo e il contenuto del messaggio per risponderti; il servizio email può trattare tali dati secondo la propria informativa."], ["Conservazione e cancellazione", "I dati didattici restano normalmente sul dispositivo fino alla cancellazione tramite l’app, se disponibile, o alla disinstallazione. Eventuali backup del sistema operativo dipendono dalle impostazioni del dispositivo e dal fornitore del sistema. Le email di assistenza sono conservate per il tempo necessario a gestire la richiesta e gli eventuali obblighi di legge."], ["Base giuridica e diritti", "Il trattamento dei dati locali è necessario a fornire le funzioni richieste dall’utente (art. 6, par. 1, lett. b, GDPR, quando applicabile). Per le richieste email si applica la gestione della richiesta e, ove pertinente, il legittimo interesse. Puoi chiedere accesso, rettifica, cancellazione, limitazione e opposizione nei casi previsti, scrivendo all’indirizzo indicato. Hai inoltre diritto di presentare reclamo al Garante per la protezione dei dati personali."], ["Minori e aggiornamenti", "KanjiGo è un’app educativa, ma non è progettata per raccogliere dati personali di minori. Eventuali modifiche sostanziali al trattamento saranno riportate in una versione aggiornata di questa informativa."]]}, "en": {"title": "Privacy Policy", "updated": "Last updated: 10 November 2026", "blocks": [["Controller and contact", "The data controller is Alessandro Boggi. For privacy questions or to exercise your rights, contact zeuslab58100@gmail.com."], ["About KanjiGo", "KanjiGo is an offline-capable educational app for Japanese kanji and vocabulary. No user account is required."], ["On-device data", "The app stores preferences (such as selected language), learning progress, results and settings on your device using SharedPreferences and SQLite. This information supports features you request and, based on the reviewed version, is not transmitted to servers operated by the controller."], ["App purchases", "Purchases are handled by Google Play or the Apple App Store under their terms and privacy notices. KanjiGo does not provide the controller with your full payment-card details."], ["Messages and recipients", "The reviewed version does not integrate user accounts, advertising, behavioral analytics or proprietary cloud services. If you email us, we use your address and message to reply. The email provider may process this data under its own privacy notice."], ["Retention and deletion", "Learning data normally remains on your device until deleted through available app functions or by uninstalling the app. Operating-system backups may depend on your device and provider settings. Support emails are retained for as long as needed to handle the request and comply with legal obligations."], ["Legal basis and rights", "Where the GDPR applies, local processing is necessary to provide requested functions (Article 6(1)(b)). Support email processing is based on handling your request and, where appropriate, legitimate interests. You may request access, correction, deletion, restriction or objection where applicable. You may also lodge a complaint with your competent data-protection authority."], ["Children and changes", "KanjiGo is educational but is not designed to collect children’s personal information. Material changes in data handling will be reflected in an updated policy."]]}, "fr": {"title": "Politique de confidentialité", "updated": "Dernière mise à jour : 10 novembre 2026", "blocks": [["Responsable et contact", "Le responsable du traitement est Alessandro Boggi. Pour toute question relative à la confidentialité ou à vos droits : zeuslab58100@gmail.com."], ["À propos de KanjiGo", "KanjiGo est une application pédagogique pour étudier les kanji et le vocabulaire japonais, utilisable hors ligne et sans création de compte."], ["Données enregistrées localement", "L’application conserve sur l’appareil les préférences (dont la langue), les progrès, les résultats et les réglages via SharedPreferences et SQLite. Ces données servent au fonctionnement demandé et, d’après la version examinée, ne sont pas transmises aux serveurs du responsable."], ["Achats dans les boutiques", "L’achat est traité par Google Play ou l’App Store d’Apple conformément à leurs conditions et politiques de confidentialité. Le responsable ne reçoit pas les données complètes de votre carte bancaire via KanjiGo."], ["Contacts et destinataires", "La version examinée n’intègre ni compte, ni publicité, ni analyse comportementale, ni service cloud propriétaire. Si vous nous écrivez, nous utilisons votre adresse et votre message pour répondre ; votre fournisseur de messagerie peut traiter ces informations selon sa propre politique."], ["Conservation et suppression", "Les données d’apprentissage restent normalement sur l’appareil jusqu’à leur suppression dans l’application, si cette fonction existe, ou jusqu’à sa désinstallation. Les sauvegardes du système dépendent des réglages et du fournisseur de l’appareil. Les emails d’assistance sont conservés pendant la durée nécessaire au traitement de la demande et aux obligations légales."], ["Base légale et droits", "Lorsque le RGPD s’applique, le traitement local est nécessaire aux fonctionnalités demandées (article 6, paragraphe 1, point b). Les emails d’assistance sont traités pour répondre à votre demande et, le cas échéant, sur la base d’un intérêt légitime. Vous pouvez demander l’accès, la rectification, l’effacement, la limitation ou vous opposer au traitement dans les cas prévus. Vous pouvez saisir l’autorité de protection des données compétente."], ["Enfants et modifications", "KanjiGo est une application éducative, mais elle n’est pas conçue pour collecter les données personnelles des enfants. Toute modification importante sera indiquée dans cette politique."]]}, "es": {"title": "Política de privacidad", "updated": "Última actualización: 10 de noviembre de 2026", "blocks": [["Responsable y contacto", "El responsable del tratamiento es Alessandro Boggi. Para consultas de privacidad o para ejercer tus derechos: zeuslab58100@gmail.com."], ["Acerca de KanjiGo", "KanjiGo es una aplicación educativa para estudiar kanji y vocabulario japonés, utilizable sin conexión y sin necesidad de crear una cuenta."], ["Datos almacenados en el dispositivo", "La aplicación guarda preferencias (por ejemplo, el idioma), progreso de aprendizaje, resultados y ajustes mediante SharedPreferences y SQLite. Estos datos permiten ofrecer las funciones solicitadas y, según la versión revisada, no se envían a servidores gestionados por el responsable."], ["Compras en las tiendas", "Las compras se procesan mediante Google Play o Apple App Store conforme a sus condiciones y políticas de privacidad. KanjiGo no facilita al responsable los datos completos de tu tarjeta de pago."], ["Comunicaciones y destinatarios", "La versión revisada no incorpora cuentas, publicidad, análisis del comportamiento ni servicios propios en la nube. Si nos escribes, usamos tu dirección y mensaje para responderte; el proveedor de correo puede tratar esos datos según su política."], ["Conservación y eliminación", "Los datos de estudio permanecen normalmente en el dispositivo hasta que se eliminen mediante funciones disponibles o se desinstale la aplicación. Las copias de seguridad del sistema dependen de sus ajustes y proveedor. Los correos de soporte se conservan el tiempo necesario para atender la consulta y cumplir las obligaciones legales."], ["Base jurídica y derechos", "Cuando resulta aplicable el RGPD, el tratamiento local es necesario para ofrecer las funciones solicitadas (artículo 6.1.b). Los correos de asistencia se tratan para responder a la solicitud y, cuando proceda, por interés legítimo. Puedes solicitar acceso, rectificación, supresión, limitación u oposición en los casos previstos y presentar una reclamación ante la autoridad de protección de datos correspondiente."], ["Menores y cambios", "KanjiGo es una aplicación educativa, pero no está diseñada para recopilar datos personales de menores. Los cambios sustanciales en el tratamiento se reflejarán en esta política."]]}, "de": {"title": "Datenschutzerklärung", "updated": "Stand: 10. November 2026", "blocks": [["Verantwortlicher und Kontakt", "Verantwortlicher für die Datenverarbeitung ist Alessandro Boggi. Fragen zum Datenschutz und Anfragen zu Ihren Rechten: zeuslab58100@gmail.com."], ["Über KanjiGo", "KanjiGo ist eine Lern-App für japanische Kanji und Vokabeln, die offline genutzt werden kann. Ein Benutzerkonto ist nicht erforderlich."], ["Lokal gespeicherte Daten", "Die App speichert Einstellungen (z. B. die gewählte Sprache), Lernfortschritt, Ergebnisse und Präferenzen mithilfe von SharedPreferences und SQLite auf Ihrem Gerät. Diese Daten werden für die von Ihnen gewünschten Funktionen benötigt und nach Prüfung der vorliegenden Version nicht an Server des Verantwortlichen übertragen."], ["Käufe über App-Stores", "Der Kauf wird von Google Play oder dem Apple App Store nach deren Bedingungen und Datenschutzhinweisen abgewickelt. Der Verantwortliche erhält über KanjiGo keine vollständigen Zahlungskartendaten."], ["Kontakt und Empfänger", "Die geprüfte Version enthält weder Benutzerkonten noch Werbung, Verhaltensanalyse oder eigene Cloud-Dienste. Wenn Sie uns per E-Mail kontaktieren, verwenden wir Ihre Adresse und Nachricht zur Beantwortung. Der E-Mail-Anbieter kann diese Daten nach seiner eigenen Datenschutzerklärung verarbeiten."], ["Aufbewahrung und Löschung", "Lerndaten bleiben grundsätzlich auf dem Gerät, bis sie über verfügbare App-Funktionen gelöscht oder die App deinstalliert wird. Betriebssystem-Backups hängen von Ihren Einstellungen und dem jeweiligen Anbieter ab. Support-E-Mails werden so lange gespeichert, wie es für die Bearbeitung und gesetzliche Pflichten erforderlich ist."], ["Rechtsgrundlagen und Rechte", "Soweit die DSGVO gilt, ist die lokale Verarbeitung zur Erbringung der angeforderten Funktionen erforderlich (Art. 6 Abs. 1 Buchst. b DSGVO). Support-E-Mails werden zur Bearbeitung Ihrer Anfrage und gegebenenfalls aufgrund berechtigter Interessen verarbeitet. Sie können im gesetzlich vorgesehenen Rahmen Auskunft, Berichtigung, Löschung, Einschränkung oder Widerspruch verlangen und sich bei der zuständigen Datenschutzaufsicht beschweren."], ["Kinder und Änderungen", "KanjiGo ist eine Lern-App, jedoch nicht auf die Erhebung personenbezogener Daten von Kindern ausgelegt. Wesentliche Änderungen der Datenverarbeitung werden in dieser Erklärung dokumentiert."]]}};function render(){let k=document.getElementById('lang').value,d=texts[k];document.documentElement.lang=k;document.title='KanjiGo · '+d.title;document.getElementById('body').innerHTML='<h1>'+d.title+'</h1><p>'+d.updated+'</p>'+d.blocks.map(b=>'<section><h2>'+b[0]+'</h2><p>'+b[1].replace('zeuslab58100@gmail.com','<a href="mailto:zeuslab58100@gmail.com">zeuslab58100@gmail.com</a>')+'</p></section>').join('')}let initial=new URLSearchParams(location.search).get('lang')||navigator.language.slice(0,2);document.getElementById('lang').value=texts[initial]?initial:'it';render();</script></body></html>
